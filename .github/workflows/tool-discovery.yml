name: scheduled-ai-tool-discovery

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27,<1.0"
      - name: Discover current AI repositories (metadata only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_ai_tools.py
      - name: Propose catalog refresh
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh AI tool discovery candidates"
          title: "Automated AI tool discovery refresh"
          body: |
            Scheduled metadata-only GitHub discovery.
            No repository code was downloaded, installed, imported, or executed.
            Review licenses, maintainers, dependencies, vulnerabilities, permissions and tests before integration.
          branch: automation/ai-tool-discovery
          delete-branch: true
          add-paths: catalog/discovery_candidates.json
