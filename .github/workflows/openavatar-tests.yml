name: OpenAvatar module tests

on:
  push:
    branches: [main, feature/openavatar-no-card]
    paths:
      - "app/openavatar.py"
      - "app/main.py"
      - "workers/openavatar/**"
      - "tests/test_openavatar.py"
      - ".github/workflows/openavatar-tests.yml"
  pull_request:
    paths:
      - "app/openavatar.py"
      - "app/main.py"
      - "workers/openavatar/**"
      - "tests/test_openavatar.py"
      - ".github/workflows/openavatar-tests.yml"

permissions:
  contents: read

jobs:
  openavatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile OpenAvatar modules
        run: python -m compileall -q app/openavatar.py workers/openavatar tests/test_openavatar.py
      - name: Run OpenAvatar API and quota tests
        run: python -m pytest -q tests/test_openavatar.py
