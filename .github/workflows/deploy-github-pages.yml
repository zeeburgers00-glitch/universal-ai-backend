name: Deploy AI YouTube Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: studio
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: "/universal-ai-backend"
      NEXT_PUBLIC_SUPABASE_URL: "https://yqutpgefnykkqjifbgec.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_eNQ8J9KZh13oM1DANlFtjQ_yuWoXmkI"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build static Studio
        run: npm run build

      - name: Add no-Jekyll marker
        run: touch out/.nojekyll

      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: studio/out

      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
