name: Universal Agent Runtime tests

on:
  push:
    branches: [main, feature/openavatar-no-card]
    paths:
      - "app/agent_runtime.py"
      - "app/main.py"
      - "workers/agent_runtime/**"
      - "tests/test_agent_runtime.py"
      - ".github/workflows/agent-runtime-tests.yml"
  pull_request:
    paths:
      - "app/agent_runtime.py"
      - "app/main.py"
      - "workers/agent_runtime/**"
      - "tests/test_agent_runtime.py"
      - ".github/workflows/agent-runtime-tests.yml"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile runtime and worker
        run: python -m compileall -q app/agent_runtime.py workers/agent_runtime tests/test_agent_runtime.py
      - name: Run runtime tests
        run: python -m pytest -q tests/test_agent_runtime.py
