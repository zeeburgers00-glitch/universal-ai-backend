[project]
name = "universal-ai-backend"
version = "0.6.0"
description = "API-only extensible AI provider gateway, global AI/MCP catalog, and REA reverse-engineering control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
