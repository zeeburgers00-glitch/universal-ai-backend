name: Build GPU voice worker image

# GitHub-hosted runners are CPU-only — no free tier includes a GPU. So this
# workflow does the one GPU-adjacent job GitHub is actually good at: it builds
# workers/voice_worker (the only CUDA image in the repo) and publishes it to
# GHCR, so a GPU host such as RunPod pulls a ready image instead of spending
# 10-20 minutes compiling PyTorch + F5-TTS on a paid pod.
#
# Running the worker itself needs a GPU notebook (see deploy/kaggle/) or a GPU
# pod (see deploy/runpod/).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/voice_worker/**"
      - ".github/workflows/voice-worker-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: voice-worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push voice worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: meta
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/universal-ai-voice-worker" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workers/voice_worker
          file: workers/voice_worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Voice worker image published"
            echo ""
            echo "Pulled on a GPU host with:"
            echo ""
            echo '```bash'
            echo "docker pull ${{ steps.meta.outputs.image }}:latest"
            echo '```'
            echo ""
            echo "Then in deploy/runpod set \`VOICE_WORKER_IMAGE=${{ steps.meta.outputs.image }}:latest\`"
            echo "and start with \`docker compose up -d --no-build\` to skip the local build."
            echo ""
            echo "This runner has **no GPU** — the image builds fine without one, but it"
            echo "cannot synthesise speech. Use deploy/kaggle/ or deploy/runpod/ to run it."
          } >> "$GITHUB_STEP_SUMMARY"
